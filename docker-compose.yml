services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback_db
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback_db"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://feedback:feedback@db:5432/feedback_db
      AUTO_CREATE_TABLES: "false"
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]

volumes:
  pgdata:
